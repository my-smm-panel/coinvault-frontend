name: Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable
      - run: flutter pub get
      - name: Build web (release)
        run: flutter build web --release --base-href /coinvault-preview/
      - name: Publish to public preview repo (GitHub Pages)
        env:
          TOKEN: ${{ secrets.GH_PREVIEW_TOKEN }}
        run: |
          OUT=preview_out
          rm -rf $OUT && mkdir -p $OUT
          cp -r build/web/* $OUT/
          cd $OUT
          git init -b main -q
          git config user.name "preview-bot"
          git config user.email "bot@coinvault.local"
          git add -A
          git commit -q -m "preview build"
          git remote add origin "https://oauth2:${TOKEN}@github.com/my-smm-panel/coinvault-preview.git"
          git push -f origin main
