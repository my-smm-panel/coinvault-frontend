name: Build All APKs (User + Admin)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build User Panel APK
        run: flutter build apk --release --split-per-abi --dart-define=APP_TYPE=user
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload User APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          TAG="user-apk-$(date -u +%Y%m%d-%H%M%S)"
          echo "Building User APK: $APK"
          
          # Create Release
          RESP=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"User Panel APK ${TAG}\",\"body\":\"CoinVault User Panel - Offers, Surveys, Earn\"}")
          
          UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url',''))" | sed 's/{?name,label}//')
          
          if [ -n "$UPLOAD_URL" ]; then
            ASSET_URL=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" \
              "${UPLOAD_URL}?name=coinvault-user-arm64.apk" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('browser_download_url',''))")
            
            echo "User APK URL: $ASSET_URL"
            
            # Send notification
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=6769498003" \
              -d "text=📱 User Panel APK: $ASSET_URL" || true
          fi

  build-admin-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/admin-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Admin Panel APK
        run: |
          flutter build apk --release --split-per-abi --dart-define=APP_TYPE=admin
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Admin APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          TAG="admin-apk-$(date -u +%Y%m%d-%H%M%S)"
          echo "Building Admin APK: $APK"
          
          # Create Release
          RESP=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Admin Panel APK ${TAG}\",\"body\":\"CoinVault Admin Panel - Dashboard, Users, Management\"}")
          
          UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url',''))" | sed 's/{?name,label}//')
          
          if [ -n "$UPLOAD_URL" ]; then
            ASSET_URL=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" \
              "${UPLOAD_URL}?name=coinvault-admin-arm64.apk" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('browser_download_url',''))")
            
            echo "Admin APK URL: $ASSET_URL"
            
            # Send notification
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=6769498003" \
              -d "text=🛡️ Admin Panel APK: $ASSET_URL" || true
          fi