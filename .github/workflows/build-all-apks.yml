name: Build All APKs (User + Admin)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        working-directory: coinvault-flutter
        run: flutter pub get

      - name: Decode keystore
        working-directory: coinvault-flutter/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build User Panel APK
        working-directory: coinvault-flutter
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: coinvault-user-apk
          path: coinvault-flutter/build/app/outputs/flutter-apk/*arm64*release.apk

  build-admin-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        working-directory: coinvault-admin
        run: flutter pub get

      - name: Decode keystore
        working-directory: coinvault-admin/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Admin Panel APK
        working-directory: coinvault-admin
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: coinvault-admin-apk
          path: coinvault-admin/build/app/outputs/flutter-apk/*arm64*release.apk
