name: Build All APKs (User + Admin)

on:
  push:
    branches: [main]
    # User-app UI changes use the dedicated user-only APK workflow instead.
    paths-ignore:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-all-apks.yml'
      - '.github/workflows/build-user-apk.yml'
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build User Panel APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send User APK to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          echo "Sending: $APK ($(du -h "$APK" | cut -f1))"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=6769498003" \
            -F "caption=📱 CoinVault User Panel APK (universal)" \
            -F "document=@$APK"

      - name: Prepare User APK release asset
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk coinvault-user-arm64.apk
          ls -la coinvault-user-arm64.apk

      - name: Replace old user-apk-latest release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/releases/tags/user-apk-latest" --silent || true
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/user-apk-latest" --silent || true

      - name: Publish User APK release (user-apk-latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: user-apk-latest
          name: "CoinVault User Panel APK"
          body: "Latest CoinVault User Panel APK (universal). Stable download link used by the in-app help center."
          files: coinvault-user-arm64.apk

  build-admin-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: coinvault-admin/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        working-directory: coinvault-admin
        run: flutter pub get

      - name: Build Admin Panel APK
        working-directory: coinvault-admin
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send Admin APK to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          APK=$(find coinvault-admin/build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "Sending: $APK"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=6769498003" \
            -F "caption=🛡️ CoinVault Admin Panel APK (arm64)" \
            -F "document=@$APK"

      - name: Prepare Admin APK release asset
        if: success()
        run: |
          cp "$(find coinvault-admin/build/app/outputs/flutter-apk -name '*arm64*v8a*release.apk' | head -1)" coinvault-admin-arm64.apk
          ls -la coinvault-admin-arm64.apk

      - name: Replace old admin-apk-latest release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/releases/tags/admin-apk-latest" --silent || true
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/admin-apk-latest" --silent || true

      - name: Publish Admin APK release (admin-apk-latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-latest
          name: "CoinVault Admin Panel APK"
          body: "Latest CoinVault Admin Panel APK (arm64). Stable download link used by the in-app help center."
          files: coinvault-admin-arm64.apk
