name: Build All APKs (User + Admin)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build User Panel APK
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send User APK to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "Sending: $APK"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=6769498003" \
            -F "caption=📱 CoinVault User Panel APK (arm64)" \
            -F "document=@$APK"

  build-admin-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: coinvault-admin/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        working-directory: coinvault-admin
        run: flutter pub get

      - name: Build Admin Panel APK
        working-directory: coinvault-admin
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send Admin APK to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          APK=$(find coinvault-admin/build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "Sending: $APK"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=6769498003" \
            -F "caption=🛡️ CoinVault Admin Panel APK (arm64)" \
            -F "document=@$APK"
