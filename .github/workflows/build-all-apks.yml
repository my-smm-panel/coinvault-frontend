name: Build All APKs (User + Admin)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build User Panel APK
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Release and notify User APK
        if: success()
        run: |
          TAG="user-apk-$(date -u +%Y%m%d-%H%M%S)"
          RELEASE_URL=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"User Panel APK $TAG\",\"body\":\"CoinVault User Panel APK\"}" \
            | jq -r '.upload_url | split("?")[0]')

          APK=$(find build/app/outputs/flutter-apk -name "*arm64*release.apk" | head -1)

          UPLOAD=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "${RELEASE_URL}?name=coinvault-user-arm64.apk" \
            | jq -r '.browser_download_url')

          MSG="📱 User Panel APK Released!\n\n$UPLOAD"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=6769498003" \
            -d "text=$MSG"

  build-admin-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Decode keystore
        working-directory: coinvault-admin/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        working-directory: coinvault-admin
        run: flutter pub get

      - name: Build Admin Panel APK
        working-directory: coinvault-admin
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Release and notify Admin APK
        if: success()
        run: |
          TAG="admin-apk-$(date -u +%Y%m%d-%H%M%S)"
          RELEASE_URL=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Admin Panel APK $TAG\",\"body\":\"CoinVault Admin Panel APK\"}" \
            | jq -r '.upload_url | split("?")[0]')

          APK=$(find coinvault-admin/build/app/outputs/flutter-apk -name "*arm64*release.apk" | head -1)

          UPLOAD=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "${RELEASE_URL}?name=coinvault-admin-arm64.apk" \
            | jq -r '.browser_download_url')

          MSG="🛡️ Admin Panel APK Released!\n\n$UPLOAD"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=6769498003" \
            -d "text=$MSG"
