name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # Local android/ folder is already committed (package come.coinvaukt.in.coinvault,
      # google-services plugin wired). No `flutter create` needed — that would wipe it.

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish APK to stable 'latest-build' release
        # Every push auto-builds the APK and refreshes this one download link.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk coinvault-latest.apk
          # delete previous release + tag so the SAME link always has the newest build
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build coinvault-latest.apk \
            --title "CoinVault latest build" \
            --notes "Auto-built from main @ ${{ github.sha }}"

      - name: Send APK to Telegram (auto-deliver)
        # After every successful build, the new APK goes straight to the user's DM.
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -F "chat_id=6769498003" \
            -F "document=@coinvault-latest.apk" \
            -F "caption=New CoinVault APK build (auto-update) ✅" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" -o /tmp/tg.json
          python3 -c "import json;d=json.load(open('/tmp/tg.json'));print('TELEGRAM SENT OK' if d.get('ok') else 'TELEGRAM FAIL: '+str(d)[:200])"

      - name: Upload signed APK (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: coinvault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
