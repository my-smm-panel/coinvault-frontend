name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # Local android/ folder is already committed (package come.coinvaukt.in.coinvault,
      # google-services plugin wired). No `flutter create` needed — that would wipe it.

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Split-per-abi keeps each APK small (<50MB) so Telegram accepts it.
      - name: Build signed release APK (split-per-abi)
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send arm64 APK to Telegram (auto-deliver)
        # Every push auto-builds and sends the newest APK straight to the DM.
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "sending $APK ($(du -h "$APK" | cut -f1))"
          curl -s -F "chat_id=6769498003" \
            -F "document=@$APK" \
            -F "caption=CoinVault new APK build (auto-update) ✅" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" -o /tmp/tg.json
          python3 -c "import json;d=json.load(open('/tmp/tg.json'));print('TELEGRAM SENT OK' if d.get('ok') else 'TELEGRAM FAIL: '+str(d)[:250])"

      - name: Web link for APK (direct download)
        # Telegram delivery can land in archive/folders; this guarantees a
        # plain browser-downloadable link every build.
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "hosting $APK ($(du -h "$APK" | cut -f1)) ..."
          URL=""
          URL=$(curl -s -m 240 -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php)
          echo "catbox reply: [$URL]"
          case "$URL" in
            https*) echo "WEB LINK: $URL" ;;
            *) URL=$(curl -s -m 240 -F "file=@$APK" https://0x0.st)
               echo "0x0.st reply: [$URL]" ;;
          esac
          case "$URL" in
            https*)
              echo "::notice title=APK ready::$URL"
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id=6769498003 \
                -d "text=CoinVault APK ready — direct download: $URL" \
                -o /tmp/tg2.json
              python3 -c "import json;d=json.load(open('/tmp/tg2.json'));print('LINK MSG SENT OK' if d.get('ok') else 'LINK MSG FAIL: '+str(d)[:200])"
              ;;
            *) echo "ALL HOSTS FAILED" ;;
          esac

      - name: Upload all APKs (artifact backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true   # storage quota may be full; APK is already delivered to Telegram
        with:
          name: coinvault-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 2
