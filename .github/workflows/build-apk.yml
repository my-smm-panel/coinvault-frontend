name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.x
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # Local android/ folder is already committed (package come.coinvaukt.in.coinvault,
      # google-services plugin wired). No `flutter create` needed — that would wipe it.

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/coinvault-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Split-per-abi keeps each APK small (<50MB) so Telegram accepts it.
      - name: Build signed release APK (split-per-abi)
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Send arm64 APK to Telegram (auto-deliver)
        # Every push auto-builds and sends the newest APK straight to the DM.
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          echo "sending $APK ($(du -h "$APK" | cut -f1))"
          curl -s -F "chat_id=6769498003" \
            -F "document=@$APK" \
            -F "caption=CoinVault new APK build (auto-update) ✅" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" -o /tmp/tg.json
          python3 -c "import json;d=json.load(open('/tmp/tg.json'));print('TELEGRAM SENT OK' if d.get('ok') else 'TELEGRAM FAIL: '+str(d)[:250])"

      - name: Publish APK to GitHub Release (direct web link)
        # Public hosts reject APKs; GitHub Releases gives a plain
        # browser-downloadable link that anyone can open without logging in.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*release.apk" | head -1)
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          echo "creating release $TAG for $APK ($(du -h "$APK" | cut -f1)) ..."
          RESP=$(curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"CoinVault APK ${TAG}\",\"body\":\"arm64-v8a release build. Install after enabling 'Install unknown apps' for your browser.\"}")
          UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url',''))" | sed 's/{?name,label}//')
          ASSET_URL=""
          if [ -n "$UPLOAD_URL" ]; then
            ASSET_URL=$(curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" \
              "${UPLOAD_URL}?name=coinvault-arm64-v8a.apk" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('browser_download_url',''))")
          fi
          echo "ASSET URL: [$ASSET_URL]"
          if [ -n "$ASSET_URL" ]; then
            echo "::notice title=APK ready::$ASSET_URL"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id=6769498003 \
              -d "text=CoinVault APK ready - download: $ASSET_URL" \
              -o /tmp/tg2.json
            python3 -c "import json;d=json.load(open('/tmp/tg2.json'));print('LINK MSG SENT OK' if d.get('ok') else 'LINK MSG FAIL: '+str(d)[:200])"
          else
            echo "RELEASE PUBLISH FAILED"; exit 1
          fi

      - name: Upload all APKs (artifact backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true   # storage quota may be full; APK is already delivered to Telegram
        with:
          name: coinvault-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 2
