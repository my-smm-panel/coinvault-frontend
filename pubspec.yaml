name: coinvault_flutter
version: 2.1.0+3
description: CoinVault mobile app — earn coins via tasks, offers, surveys, spin & scratch cards. Flutter frontend for the CoinVault backend API.
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  firebase_database: ^10.0.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.jpg
    - assets/app_icon_name.png
    - assets/bear.png
    - assets/bear_redeem.png
    - assets/bear_tasks.png
    - assets/bear_earn.png
    - assets/google_g.png
    - assets/bear_avatar.png
    - assets/brands/amazon.png
    - assets/brands/phonepe.png
    - assets/brands/paytm.png
    - assets/brands/flipkart.png
    - assets/brands/googleplay.png
    - assets/brands/myntra.png
    - assets/brands/ajio.png
    - assets/brands/swiggy.png
    - assets/brands/zomato.png
    - assets/brands/netflix.png
    - assets/brands/spotify.png
    - assets/brands/ola.png
    - assets/login_screen.png
    - assets/coin_zip.png
    - assets/logo_circle.png
    - assets/wheel.png
    - assets/spin_bg.png
    - assets/coin.png
    - assets/scratch.png
    - assets/trophy.png
    - assets/logos/
    - assets/apps/mpl.png
    - assets/apps/ludo.png
    - assets/apps/rummy.png
    - assets/apps/dream11.png
